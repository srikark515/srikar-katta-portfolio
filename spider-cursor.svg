<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">
  <defs>
    <filter id="spidey-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#ef4444" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- 8 Spider Legs in Spider-Man angular geometry -->
  <!-- Left Legs -->
  <path d="M 12 10 C 8 4, 3 5, 2 10" fill="none" stroke="#ef4444" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 12 12 C 6 8, 2 11, 1 15" fill="none" stroke="#ef4444" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 12 16 C 6 20, 2 24, 4 27" fill="none" stroke="#ef4444" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 12 18 C 7 22, 5 26, 7 28" fill="none" stroke="#ef4444" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Right Legs -->
  <path d="M 16 10 C 20 4, 25 5, 26 10" fill="none" stroke="#ef4444" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 16 12 C 22 8, 26 11, 27 15" fill="none" stroke="#ef4444" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 16 16 C 22 20, 26 24, 24 27" fill="none" stroke="#ef4444" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 16 18 C 21 22, 23 26, 21 28" fill="none" stroke="#ef4444" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Spider Body -->
  <!-- Head -->
  <ellipse cx="14" cy="8" rx="2.4" ry="2" fill="#ef4444" filter="url(#spidey-shadow)"/>
  <!-- White Expressive Eyes -->
  <circle cx="13.2" cy="7.6" r="0.75" fill="#ffffff"/>
  <circle cx="14.8" cy="7.6" r="0.75" fill="#ffffff"/>
  <!-- Thorax -->
  <ellipse cx="14" cy="13" rx="3.4" ry="3.4" fill="#ef4444" filter="url(#spidey-shadow)"/>
  <!-- Iconic Abdomen -->
  <path d="M 11.6 15 C 10.2 20, 12.4 24, 14 26 C 15.6 24, 17.8 20, 16.4 15 Z" fill="#ef4444" filter="url(#spidey-shadow)"/>
  <!-- Dark Emblem Core -->
  <ellipse cx="14" cy="13.5" rx="1.5" ry="1.9" fill="#0f172a"/>
</svg>

